<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全履歴アーカイブ</title>
  
  <link rel="stylesheet" href="style.css?v=1">
  
  <style>
    .backup-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body ontouchstart="">

  <!-- ヘッダー -->
  <div class="header-bar">
    <h2>全履歴アーカイブ</h2>
    <div>
      <a href="index.html" class="header-nav-link">集計画面</a>
      <a href="input.html" class="header-nav-link">入力画面</a>
    </div>
  </div>

  <!-- ステータス表示 -->
  <div id="statusInfo" class="status-text">永久履歴データに接続中...</div>

  <!-- 集計カード -->
  <div class="summary-box">
    <div class="summary-card">
      <div class="summary-label">累計記録件数</div>
      <div class="summary-value" id="historyCount">0 <span class="unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">累計総金額</div>
      <div class="summary-value" id="historyAmount">0 <span class="unit">円</span></div>
    </div>
  </div>

  <!-- 操作ボタン -->
  <div class="backup-bar">
    <button type="button" class="btn-action" style="max-width: 160px;" onclick="downloadCSV()">📥 全履歴CSV出力</button>
  </div>

  <!-- 履歴テーブル -->
  <h3>永久記録ログ（moneyLogsHistory）</h3>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>金額(円)</th>
          <th>担当者</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="3" style="padding: 20px; color: var(--text-sub);">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const HISTORY_DB_URL = "https://nf-reception-default-rtdb.asia-southeast1.firebasedatabase.app/moneyLogsHistory";
    let historyLogs = [];
    let historyEventSource = null;

    window.onload = function() {
      initHistoryStream();
    };

    // moneyLogsHistory のリアルタイム監視（入力・削除を即座に自動反映）
    function initHistoryStream() {
      if (historyEventSource) historyEventSource.close();

      const statusEl = document.getElementById('statusInfo');
      historyEventSource = new EventSource(`${HISTORY_DB_URL}.json`);

      historyEventSource.onopen = () => {
        statusEl.textContent = `リアルタイム同期中: 全 ${historyLogs.length} 件の永久記録を表示中`;
        statusEl.style.color = "var(--status-online-text)";
      };

      historyEventSource.addEventListener('put', (e) => {
        const res = JSON.parse(e.data);
        if (!res) return;

        if (res.path === '/') {
          const rawData = res.data || {};
          historyLogs = Object.keys(rawData).map(key => ({
            key,
            ...rawData[key]
          }));
        } else {
          const key = res.path.split('/')[1];
          if (res.data === null) {
            historyLogs = historyLogs.filter(item => item.key !== key);
          } else {
            const index = historyLogs.findIndex(item => item.key === key);
            if (index > -1) {
              historyLogs[index] = { key, ...res.data };
            } else {
              historyLogs.push({ key, ...res.data });
            }
          }
        }

        statusEl.textContent = `リアルタイム同期中: 全 ${historyLogs.length} 件の永久記録を表示中`;
        statusEl.style.color = "var(--status-online-text)";
        renderHistoryTable();
      });

      historyEventSource.onerror = (err) => {
        console.warn("履歴ストリーム再接続待機中...", err);
        statusEl.textContent = "再接続待機中...";
        statusEl.style.color = "var(--cancel-text)";
      };
    }

    // 画面テーブル描画
    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      const count = historyLogs.length;
      const sum = historyLogs.reduce((acc, item) => acc + Number(item.amount || 0), 0);

      document.getElementById('historyCount').innerHTML = `${count} <span class="unit">件</span>`;
      document.getElementById('historyAmount').innerHTML = `${sum.toLocaleString()} <span class="unit">円</span>`;

      if (count === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="padding: 20px; color: var(--text-sub);">履歴データがありません。</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();
      const logsToRender = historyLogs.slice().reverse();

      logsToRender.forEach(item => {
        const tr = document.createElement('tr');
        
        const tdDate = document.createElement('td');
        tdDate.textContent = item.date || "-";

        const tdAmount = document.createElement('td');
        tdAmount.textContent = Number(item.amount || 0).toLocaleString();

        const tdUser = document.createElement('td');
        tdUser.textContent = item.user || "未設定";

        tr.appendChild(tdDate);
        tr.appendChild(tdAmount);
        tr.appendChild(tdUser);
        fragment.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(fragment);
    }

    // CSVダウンロード処理
    function downloadCSV() {
      if (historyLogs.length === 0) {
        alert("出力するデータがありません");
        return;
      }

      let csvContent = '\uFEFF日時,金額,担当者,固有ID\n';
      historyLogs.forEach(item => {
        csvContent += `"${item.date || ''}",${item.amount || 0},"${item.user || ''}","${item.id || ''}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `全受付永久履歴アーカイブ_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
