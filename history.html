<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全履歴アーカイブ・復元</title>
  
  <!-- 既存のCSSをそのまま使用 -->
  <link rel="stylesheet" href="style.css?v=1">
  
  <style>
    .backup-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .status-text {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body ontouchstart="">

  <!-- ヘッダー -->
  <div class="header-bar">
    <h2>全履歴アーカイブ</h2>
    <div>
      <a href="index.html" class="header-nav-link">集計画面</a>
      <a href="input.html" class="header-nav-link">入力画面</a>
    </div>
  </div>

  <!-- ステータス表示 -->
  <div id="statusInfo" class="status-text">永久履歴データを読み込み中...</div>

  <!-- 集計カード -->
  <div class="summary-box">
    <div class="summary-card">
      <div class="summary-label">累計記録件数</div>
      <div class="summary-value" id="historyCount">0 <span class="unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">累計総金額</div>
      <div class="summary-value" id="historyAmount">0 <span class="unit">円</span></div>
    </div>
  </div>

  <!-- 操作ボタン群 -->
  <div class="backup-bar">
    <button type="button" class="btn-action" style="background-color: var(--primary); color: #ffffff; border: none;" onclick="restoreMissingLogs()">🔄 誤削除データをメイン画面に復元</button>
    <button type="button" class="btn-action" onclick="downloadCSV()">📥 全履歴CSV出力</button>
  </div>

  <!-- 履歴テーブル -->
  <h3>永久記録ログ（moneyLogsHistory）</h3>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>金額(円)</th>
          <th>担当者</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <tr><td colspan="3" style="padding: 20px; color: var(--text-sub);">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // エンドポイント設定
    const MAIN_DB_URL = "https://nf-reception-default-rtdb.asia-southeast1.firebasedatabase.app/moneyLogs";
    const HISTORY_DB_URL = "https://nf-reception-default-rtdb.asia-southeast1.firebasedatabase.app/moneyLogsHistory";
    
    let historyLogs = [];

    window.onload = function() {
      fetchHistoryData();
    };

    // 削除不可能な履歴アーカイブ（moneyLogsHistory）から全データを取得
    async function fetchHistoryData() {
      const statusEl = document.getElementById('statusInfo');
      try {
        const res = await fetch(`${HISTORY_DB_URL}.json`);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const data = await res.json() || {};
        
        // オブジェクトを配列に変換
        historyLogs = Object.keys(data).map(key => ({
          key,
          ...data[key]
        }));

        statusEl.textContent = `同期完了: 永久保存された全 ${historyLogs.length} 件のデータを受信しました`;
        statusEl.style.color = "var(--status-online-text)";
        
        renderHistoryTable();
      } catch (err) {
        console.error("履歴取得エラー:", err);
        statusEl.textContent = "データ取得エラー: " + err.message;
        statusEl.style.color = "var(--delete-text)";
      }
    }

    // 画面テーブル描画
    function renderHistoryTable() {
      const tbody = document.getElementById('historyTableBody');
      const count = historyLogs.length;
      const sum = historyLogs.reduce((acc, item) => acc + Number(item.amount || 0), 0);

      document.getElementById('historyCount').innerHTML = `${count} <span class="unit">件</span>`;
      document.getElementById('historyAmount').innerHTML = `${sum.toLocaleString()} <span class="unit">円</span>`;

      if (count === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="padding: 20px; color: var(--text-sub);">履歴データがありません。</td></tr>';
        return;
      }

      const fragment = document.createDocumentFragment();
      // 新しい順に並び替えて描画
      const logsToRender = historyLogs.slice().reverse();

      logsToRender.forEach(item => {
        const tr = document.createElement('tr');
        
        const tdDate = document.createElement('td');
        tdDate.textContent = item.date || "-";

        const tdAmount = document.createElement('td');
        tdAmount.textContent = Number(item.amount || 0).toLocaleString();

        const tdUser = document.createElement('td');
        tdUser.textContent = item.user || "未設定";

        tr.appendChild(tdDate);
        tr.appendChild(tdAmount);
        tr.appendChild(tdUser);
        fragment.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(fragment);
    }

    // 💡 ワンクリック復元機能（moneyLogs に存在しないデータだけを補填書き戻し）
    async function restoreMissingLogs() {
      if (historyLogs.length === 0) {
        alert("復元可能な履歴データが存在しません");
        return;
      }

      const statusEl = document.getElementById('statusInfo');
      
      try {
        statusEl.textContent = "復元状態を照合中...";

        // 1. 現在のメインDB (moneyLogs) の状態を取得
        const mainRes = await fetch(`${MAIN_DB_URL}.json`);
        const mainData = await mainRes.json() || {};
        const existingMainIds = new Set(Object.values(mainData).map(m => m.id).filter(Boolean));

        // 2. メイン側に存在しない（誤って削除された）データを抽出
        const missingLogs = historyLogs.filter(h => h.id && !existingMainIds.has(h.id));

        if (missingLogs.length === 0) {
          alert("メイン画面（moneyLogs）に未復元の削除データはありません。すべてのデータが揃っています。");
          statusEl.textContent = "全データ同期完了（欠損データなし）";
          return;
        }

        if (!confirm(`誤削除された可能性のあるデータが ${missingLogs.length} 件見つかりました。\nメイン画面のデータベース（moneyLogs）に復元しますか？`)) {
          return;
        }

        statusEl.textContent = `復元中... (0/${missingLogs.length})`;
        let restoredCount = 0;

        // 3. 差分データを Firebase の moneyLogs に1件ずつ書き戻す
        for (const log of missingLogs) {
          const payload = {
            id: String(log.id),
            date: String(log.date || new Date().toLocaleString()),
            amount: Number(log.amount || 0),  // バリデーションエラー防止用数値キャスト
            user: String(log.user || "復元データ"),
            timestamp: Number(log.timestamp || Date.now())
          };

          const postRes = await fetch(`${MAIN_DB_URL}.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (postRes.ok) {
            restoredCount++;
            statusEl.textContent = `復元中... (${restoredCount}/${missingLogs.length})`;
          }
        }

        alert(`復元が完了しました！\n計 ${restoredCount} 件のデータをメイン画面に書き戻しました。`);
        statusEl.textContent = `復元完了: ${restoredCount} 件のデータをメインDBへ書き戻しました`;
      } catch (err) {
        console.error("復元処理エラー:", err);
        alert("復元処理中にエラーが発生しました: " + err.message);
      }
    }

    // CSVダウンロード処理
    function downloadCSV() {
      if (historyLogs.length === 0) {
        alert("出力するデータがありません");
        return;
      }

      let csvContent = '\uFEFF日時,金額,担当者,固有ID\n';
      historyLogs.forEach(item => {
        csvContent += `"${item.date || ''}",${item.amount || 0},"${item.user || ''}","${item.id || ''}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `全受付永久履歴アーカイブ_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
